[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "my-tiny-torch"
version = "0.1.0"
description = "A Python machine learning library built from scratch, inspired by TinyTorch"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7", "build>=1"]
notebook = ["ipykernel>=6"]

[project.urls]
Repository = "https://github.com/abhishek2002228/my-tiny-torch"
Documentation = "https://github.com/abhishek2002228/my-tiny-torch/blob/main/docs/tensors.md"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tinytorch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
