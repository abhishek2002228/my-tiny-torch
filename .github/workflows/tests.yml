name: Tests and package

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            numpy: "numpy==1.24.4"
          - python: "3.13"
            numpy: "numpy>=2.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install library and test tools
        run: python -m pip install -e '.[dev]' '${{ matrix.numpy }}'
      - name: Test API, storage, operations, and dispatch
        run: python -m pytest -q
      - name: Build source distribution and wheel
        run: python -m build
      - name: Verify wheel installation outside the repository
        shell: bash
        run: |
          python -m venv /tmp/tensor-wheel-check
          /tmp/tensor-wheel-check/bin/python -m pip install dist/*.whl '${{ matrix.numpy }}'
          cp examples/tensor_basics.py /tmp/tensor_basics.py
          cd /tmp
          /tmp/tensor-wheel-check/bin/python tensor_basics.py
